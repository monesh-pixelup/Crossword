# Every push to main: build once, keep the build for 30 days, and deploy it to https://staging.crossword.ai.
# Production never deploys from here: "ship it" on an issue (or running "Promote to production") ships a build that
# staging has already served.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx opennextjs-cloudflare build
      - uses: actions/upload-artifact@v4
        with:
          name: open-next
          path: .open-next
          include-hidden-files: true
          retention-days: 30

  staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.crossword.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: open-next
          path: .open-next
      - name: Deploy crossword-website (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/wrangler-target.mjs --name crossword-website --domain staging.crossword.ai \
            --cache-prefix staging > wrangler.target.jsonc
          npx opennextjs-cloudflare deploy --config wrangler.target.jsonc
      - name: Summary
        run: |
          {
            echo "Staging now serves ${GITHUB_SHA::7}: https://staging.crossword.ai"
            echo
            echo "To ship this build: Actions → Promote to production → Run workflow (leave the run ID empty for this one: ${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"
