# Deletes the preview Worker (crossword-website-issue-<n>) of every closed issue, with any custom domain it still has;
# Cloudflare removes that domain's DNS record and certificate with it.
# Runs when a person closes an issue, every hour (issues that workflows close, such as "ship it", don't start other
# workflows, so the hourly sweep catches those), and by hand (Actions → Preview cleanup, optionally with one issue).
# Uses the Cloudflare API directly: "wrangler delete" also lists KV namespaces, which the token can't read.
name: Preview cleanup

on:
  issues:
    types: [closed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number whose preview to delete (leave empty to sweep every closed issue)
        required: false

permissions:
  issues: read

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete previews of closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ github.event.issue.number || inputs.issue }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers"
          if [ -n "$ONLY" ] && ! [[ "$ONLY" =~ ^[0-9]+$ ]]; then echo "Not an issue number: $ONLY"; exit 1; fi

          scripts=$(api "$base/scripts" | jq -er '.result[].id') || { echo "Couldn't list Workers"; exit 1; }
          domains=$(api "$base/domains?per_page=100" | jq -ec '.result') || { echo "Couldn't list custom domains"; exit 1; }
          failed=0
          for s in $(grep -E '^crossword-website-issue-[0-9]+$' <<<"$scripts" || true); do
            n=${s#crossword-website-issue-}
            [ -z "$ONLY" ] || [ "$n" = "$ONLY" ] || continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq .state 2>/dev/null || echo unknown)
            [ "$state" = closed ] || { echo "#$n is $state; keeping $s"; continue; }
            for id in $(jq -r --arg s "$s" '.[] | select(.service == $s) | .id' <<<"$domains"); do
              # Go by the status code: the first sweep got no JSON "success" back although the records went.
              code=$(api -o /dev/null -w '%{http_code}' -X DELETE "$base/domains/$id")
              case "$code" in
                200|204|404) echo "Removed custom domain $id from $s" ;;
                *) echo "Couldn't remove custom domain $id from $s (HTTP $code)"; failed=1 ;;
              esac
            done
            api -X DELETE "$base/scripts/$s?force=true" | jq -e '.success' >/dev/null \
              && echo "Deleted $s (#$n is closed)" || { echo "Couldn't delete $s"; failed=1; }
          done
          exit $failed
