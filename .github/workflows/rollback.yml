# Puts production back on an earlier version of the Worker crossword-website-production. Run it by hand from the
# Actions tab. With no version ID it goes back one version.
name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version ID to go back to (empty = the previous one)
        required: false
      reason:
        description: Why (kept in Cloudflare's deployment history)
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://crossword.ai
    steps:
      - name: Roll back crossword-website-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -n "$VERSION_ID" ] && ! [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "Not a version ID: $VERSION_ID"; exit 1; fi
          npx --yes wrangler@4.168.0 rollback $VERSION_ID --name crossword-website-production --message "$REASON" -y
          npx --yes wrangler@4.168.0 deployments list --name crossword-website-production | head -40 >> "$GITHUB_STEP_SUMMARY"
