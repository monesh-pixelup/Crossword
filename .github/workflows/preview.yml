# Builds an issue's branch and deploys it as its own Worker at https://issue-<n>.preview.crossword.ai, on every push.
# Branches: ai/issue-<n> (the AI's), or a person's issue-<n>, issue-<n>-<words> or <name>/issue-<n>...
# The comment "preview" on the issue runs this by hand (Issue commands).
# For the AI's branch the issue watcher posts the link with screenshots; for anything else this workflow posts it.
name: Preview

on:
  push:
    branches: ["ai/issue-*", "issue-*", "*/issue-*"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Finds the issue number in the branch name. Branches without one, or whose issue is closed, get no preview.
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      n: ${{ steps.target.outputs.n }}
    steps:
      - name: Work out the issue number
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          re='(^|/)issue-([0-9]+)([-_/]|$)'
          if ! [[ "$GITHUB_REF_NAME" =~ $re ]]; then echo "Branch $GITHUB_REF_NAME names no issue; no preview."; exit 0; fi
          n=${BASH_REMATCH[2]}
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq 'if .pull_request then "pr" else .state end' 2>/dev/null || echo missing)
          if [ "$state" != open ]; then echo "#$n is $state, not an open issue; no preview."; exit 0; fi
          echo "n=$n" >> "$GITHUB_OUTPUT"

  preview:
    needs: target
    if: needs.target.outputs.n != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Set the address
        id: target
        run: |
          n=${{ needs.target.outputs.n }}
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "url=https://issue-$n.preview.crossword.ai" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx opennextjs-cloudflare build

      - name: Make sure the media bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket info crossword-website-media >/dev/null 2>&1 || npx wrangler r2 bucket create crossword-website-media
      - name: Deploy crossword-website-issue-${{ steps.target.outputs.n }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          n=${{ steps.target.outputs.n }}
          node scripts/wrangler-target.mjs --name "crossword-website-issue-$n" \
            --domain "issue-$n.preview.crossword.ai" --cache-prefix "issue-$n" > wrangler.target.jsonc
          npx opennextjs-cloudflare deploy --config wrangler.target.jsonc

      - name: Wait for the address to answer
        run: |
          # A new custom domain needs a certificate first; that can take a few minutes.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.target.outputs.url }}/" || true)
            if [ "$code" = 200 ]; then echo "Up after $i tries"; exit 0; fi
            sleep 15
          done
          echo "${{ steps.target.outputs.url }} still returns $code after 10 minutes"; exit 1

      - name: Summary
        if: always()
        env:
          N: ${{ steps.target.outputs.n }}
          URL: ${{ steps.target.outputs.url }}
        run: |
          echo "Preview for issue #$N: $URL" >> "$GITHUB_STEP_SUMMARY"

      # The AI's pushes are announced by the watcher, with screenshots. Everything else is announced here.
      - name: Post the link on the issue
        if: (success() || failure()) && (github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'ai/'))
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.target.outputs.n }}
          URL: ${{ steps.target.outputs.url }}
          OK: ${{ job.status == 'success' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=${GITHUB_SHA::7}
          if [ "$OK" = true ]; then
            body="Preview of \`$GITHUB_REF_NAME\` (commit $sha) is up: **$URL**

          **Next step:** check it, then comment \`approved\` to put it on staging, or \`ship it\` to send it straight to production (that works only when nothing else is waiting on staging)."
          else
            body="The preview build of \`$GITHUB_REF_NAME\` (commit $sha) failed, so $URL still shows the last good build. Log: $RUN"
          fi
          gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n---\n_Posted by the Preview workflow_' "$body")" >/dev/null
          gh issue edit "$N" -R "$GITHUB_REPOSITORY" --add-label needs-you >/dev/null 2>&1 || true
