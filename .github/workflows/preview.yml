# Builds an issue branch (ai/issue-<n>) and deploys it as its own Worker at https://issue-<n>.preview.crossword.ai.
# The issue watcher waits for this run, then posts the link and screenshots on the issue.
name: Preview

on:
  push:
    branches: ["ai/issue-*"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Work out the issue number
        id: target
        run: |
          n="${GITHUB_REF_NAME#ai/issue-}"
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then echo "Branch $GITHUB_REF_NAME is not ai/issue-<number>"; exit 1; fi
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "url=https://issue-$n.preview.crossword.ai" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx opennextjs-cloudflare build

      - name: Deploy crossword-website-issue-${{ steps.target.outputs.n }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          n=${{ steps.target.outputs.n }}
          node scripts/wrangler-target.mjs --name "crossword-website-issue-$n" \
            --domain "issue-$n.preview.crossword.ai" --cache-prefix "issue-$n" > wrangler.target.jsonc
          npx opennextjs-cloudflare deploy --config wrangler.target.jsonc

      - name: Wait for the address to answer
        run: |
          # A new custom domain needs a certificate first; that can take a few minutes.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.target.outputs.url }}/" || true)
            if [ "$code" = 200 ]; then echo "Up after $i tries"; exit 0; fi
            sleep 15
          done
          echo "${{ steps.target.outputs.url }} still returns $code after 10 minutes"; exit 1

      - name: Summary
        if: always()
        env:
          N: ${{ steps.target.outputs.n }}
          URL: ${{ steps.target.outputs.url }}
        run: |
          echo "Preview for issue #$N: $URL" >> "$GITHUB_STEP_SUMMARY"
